appId: de.fraedrich.assetlibrary
productName: Asset Library
artifactName: ${productName}-${version}-${arch}.${ext}
directories:
  output: dist
  buildResources: build
files:
  - out/**
  - package.json
asar: true
win:
  icon: build/icon.png
  target:
    - target: nsis
      arch: [x64]
    - target: portable
      arch: [x64]
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  shortcutName: Asset Library
portable:
  artifactName: ${productName}-${version}-portable.${ext}
